name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout for the existing Python selection
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Select the existing Python compatibility line
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: .github/.python-version
      - name: Prepare the public CI job
        id: setup
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@2a111c167e685fe37ef643b37abfdd42702d18cc # v0.6.70
        with:
          managed: 'false'
          fetch-depth: 1
          python-version: ${{ steps.python.outputs.python-version }}
      - name: Install the unchanged test dependency
        id: dependencies
        run: just setup
      - name: Validate every existing adapter contract and behavior fixture
        id: project
        run: just validate
      - name: Complete the public CI job
        if: always()
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/complete@2a111c167e685fe37ef643b37abfdd42702d18cc # v0.6.70
        with:
          status: ${{ job.status }}
          project-outcome: ${{ steps.setup.outcome == 'success' && contains(steps.*.outcome, 'failure') && 'failure' || steps.project.outcome }}
          task: validate
          name: validate
          read-token: ${{ steps.setup.outputs.read-token }}
          reports: pytest.xml

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prepare the public CI job
        id: setup
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@2a111c167e685fe37ef643b37abfdd42702d18cc # v0.6.70
        with:
          managed: 'false'
          fetch-depth: 0
          tools: zizmor@1.32.0,shellcheck@0.11.0
          tool-assets: .github/ci-tools.json
      - name: Check workflows, shell and complete Git history
        id: project
        run: just check-ci
      - name: Complete the public CI job
        if: always()
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/complete@2a111c167e685fe37ef643b37abfdd42702d18cc # v0.6.70
        with:
          status: ${{ job.status }}
          project-outcome: ${{ steps.setup.outcome == 'success' && contains(steps.*.outcome, 'failure') && 'failure' || steps.project.outcome }}
          task: workflows
          name: workflows
          read-token: ${{ steps.setup.outputs.read-token }}
