name: Dependency check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-check-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  dependency-check:
    name: Dependency check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout for the existing Python selection
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Select the existing Python compatibility line
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: .github/.python-version
      - name: Prepare the public CI job
        id: setup
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@2a111c167e685fe37ef643b37abfdd42702d18cc # v0.6.70
        with:
          managed: 'false'
          fetch-depth: 1
          python-version: ${{ steps.python.outputs.python-version }}
      - name: Check the existing runtime and MCP dependency policy
        id: project
        run: just check-dependencies
      - name: Complete the public CI job
        if: always()
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/complete@2a111c167e685fe37ef643b37abfdd42702d18cc # v0.6.70
        with:
          status: ${{ job.status }}
          project-outcome: ${{ steps.setup.outcome == 'success' && contains(steps.*.outcome, 'failure') && 'failure' || steps.project.outcome }}
          task: dependency-policy
          name: dependency-policy
          read-token: ${{ steps.setup.outputs.read-token }}
