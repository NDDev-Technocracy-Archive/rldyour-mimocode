name: cross-platform

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout for the existing Python selection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Select the existing Python compatibility line
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: .github/.python-version
      - name: Prepare the public CI job
        id: setup
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@2a111c167e685fe37ef643b37abfdd42702d18cc # v0.6.70
        with:
          managed: 'false'
          fetch-depth: 1
          python-version: ${{ steps.python.outputs.python-version }}
      - name: Install the unchanged test dependency
        id: dependencies
        run: just setup
      - name: Check all fourteen source contracts
        id: source
        run: just check-source
      - name: Run the full existing Linux and macOS suite
        id: project
        if: runner.os != 'Windows'
        run: just test
      - name: Run the existing selected Windows suite
        id: windows
        if: runner.os == 'Windows'
        run: just test-windows
      - name: Complete the public CI job
        if: always()
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/complete@2a111c167e685fe37ef643b37abfdd42702d18cc # v0.6.70
        with:
          status: ${{ job.status }}
          project-outcome: ${{ steps.setup.outcome == 'success' && contains(steps.*.outcome, 'failure') && 'failure' || runner.os == 'Windows' && steps.windows.outcome || steps.project.outcome }}
          task: cross-${{ matrix.os }}
          name: cross-${{ matrix.os }}
          read-token: ${{ steps.setup.outputs.read-token }}
          reports: pytest.xml
